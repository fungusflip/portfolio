<!-- Talar om för webbläsaren att det här är modern HTML. -->
<!doctype html>
<!-- <html> omsluter hela sidan. lang anger sidans språk. -->
<html lang="en">

<!-- <head> = inställningar och filer som ska laddas. Inget här syns på själva sidan. -->
<head>
  <!-- Teckenkodning: utf-8 klarar alla tecken, t.ex. å, ä, ö. -->
  <meta charset="utf-8">
  <!-- Gör att sidan får rätt bredd och skala på mobiler. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Texten på webbläsarfliken. -->
  <title>Portfolio</title>
  <!-- Laddar utseendet från css/style.css. -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Import-karta: en ordlista för JavaScript. När js/main.js skriver
       import ... from 'three' slår webbläsaren upp 'three' här och hämtar
       three.js från nätet (jsDelivr). Därför behövs ingen installation.
       "three/addons/" är extra-delarna (t.ex. modell-laddare) för senare.
       "gifuct-js" är ett litet bibliotek som packar upp gif-filer. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
        "gifuct-js": "https://cdn.jsdelivr.net/npm/gifuct-js@2.1.2/+esm"
      }
    }
  </script>
</head>

<!-- <body> = det som syns på sidan. -->
<body>
  <!-- En canvas är en tom rityta. three.js ritar 3D-scenen i den.
       id="scene" är namnet som både style.css (#scene) och main.js letar efter. -->
  <canvas id="scene"></canvas>

  <!-- Guiden: en liten ruta i nedre vänstra hörnet som visar vilka tangenter som gäller.
       Den ligger ovanpå canvasen (se .guide i css/style.css).
       <kbd> är HTML-elementet för en tangent. -->
  <div class="guide">
    <!-- Rad 1 visas alltid. -->
    <div class="guide-row">
      <span class="guide-keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
      <span>Drive</span>
    </div>
    <!-- Rad 2 visas bara när bilen står framför en skylt. "hidden" gömmer den från början;
         js/main.js tar bort och sätter tillbaka "hidden" och fyller i texten. -->
    <div class="guide-row" id="guideEnter" hidden>
      <span class="guide-keys"><kbd>Enter</kbd><kbd>Tab</kbd></span>
      <span id="guideText"></span>
    </div>
  </div>

  <!-- Touchkontroller för mobil och surfplatta. De syns bara på skärmar med touch
       (se @media (pointer: coarse) i css/style.css). Varje knapp låtsas vara en tangent:
       data-key är tangentens namn, samma som e.code i js/main.js. -->
  <div class="touch" id="touch">
    <div class="touch-group touch-left">
      <button class="touch-btn" data-key="KeyA" aria-label="Steer left">&#9664;</button>
      <button class="touch-btn" data-key="KeyD" aria-label="Steer right">&#9654;</button>
    </div>
    <!-- Den här knappen ersätter Enter/Tab. js/main.js visar den bara framför en skylt. -->
    <button class="touch-action" id="touchAction" hidden>Read more</button>
    <div class="touch-group touch-right">
      <button class="touch-btn" data-key="KeyW" aria-label="Drive forward">&#9650;</button>
      <button class="touch-btn" data-key="KeyS" aria-label="Reverse">&#9660;</button>
    </div>
  </div>

  <!-- Infopanelen: öppnas med Enter/Tab på en parkeringsruta. "hidden" gömmer den från början.
       js/main.js fyller i kategori, rubrik och text (texten hämtas från assets/content/). -->
  <aside class="panel" id="panel" hidden>
    <header class="panel-head">
      <div>
        <div class="panel-category" id="panelCategory"></div>
        <h1 class="panel-title" id="panelTitle"></h1>
      </div>
      <button class="panel-close" id="panelClose" aria-label="Close">&times;</button>
    </header>
    <!-- Själva texten, bilderna och videorna. -->
    <div class="panel-body" id="panelBody"></div>
    <a class="panel-link" id="panelLink" target="_blank" rel="noopener">Open the full page &rarr;</a>
    <div class="panel-hint"><kbd>Esc</kbd> close</div>
  </aside>

  <!-- Startar programmet. type="module" krävs för att "import" ska fungera.
       Ligger sist i body så att canvasen redan finns när koden körs. -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
